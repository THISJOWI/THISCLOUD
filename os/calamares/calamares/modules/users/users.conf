# THISCLOUD Calamares users module configuration.
# Hypervisor Administrator (root) and administrative user configuration.
---
# Default groups for the primary admin user
defaultGroups:
    - wheel
    - kvm
    - libvirt

# Security defaults
doAutologin: false
sudoersGroup: wheel
setRootPassword: true

# Password validation requirements
passwordRequirements:
    minLength: 6
    maxLength: -1
    checkPWQuality: false

# User and Hostname defaults
defaultUsername: "admin"
defaultFullName: "THISCLOUD Administrator"

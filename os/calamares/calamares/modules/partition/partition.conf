# THISCLOUD Calamares partition module configuration.
# Optimized for dedicated Hypervisor appliance installation.
---
# Default filesystem type for the root partition
defaultFileSystemType: "ext4"

# Default partition table scheme (GPT for modern UEFI/BIOS)
defaultPartitionTableType: "gpt"

# Pre-select "Erase disk" to provide a streamlined, Proxmox-like disk wipe & install experience
initialPartitioningChoice: erase

# Swap configuration: no swap by default for hypervisor hosts (avoid memory paging for VMs)
initialSwapChoice: none
userSwapChoices:
    - none
    - small
    - file

# EFI system partition parameters
efi:
    mountPoint: "/boot/efi"
    size: 512MiB
    recommendedSize: 512MiB
    minimumSize: 300MiB
    label: "EFI"

# Disk labels and visualization
alwaysShowPartitionLabels: true
showTreeView: false
enableLuks: false

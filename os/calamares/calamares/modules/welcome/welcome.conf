# THISCLOUD Calamares welcome module configuration.
# Provides system requirements check and language selection on startup.
---
# Show traditional welcome style
showSupportUrl: false
showKnownIssuesUrl: false
showReleaseNotesUrl: false
showDonateUrl: false

# System requirements check for THISCLOUD Hypervisor
requirements:
    requiredStorage: 20.0
    requiredRam: 4.0
    internetCheckUrl: http://connectivity-check.ubuntu.com
    check:
        - storage
        - ram
        - power
        - internet
    required:
        - storage
        - ram

# GeoIP for initial timezone/locale guess (optional, non-blocking)
geoip:
    style: "none"

# Language selector directly visible on the welcome page
languageIcon: "preferences-desktop-locale"

openapi: "3.0.3"
info:
  title: THISCLOUD Daemon API
  description: |
    Central API for THISCLOUD hypervisor OS. Exposed by `thiscloudd` on port 8080.
    All resource endpoints are scoped to a tenant via `X-Tenant-Id` header (after T0.4).
  version: "1.0.0"
  contact:
    name: THISJOWI
servers:
  - url: http://127.0.0.1:8080/api/v1
    description: Local daemon (versioned API)

security:
  - BearerAuth: []

paths:
  /openapi.yaml:
    get:
      summary: This contract (OpenAPI)
      tags: [System]
      security: []
      responses:
        "200":
          description: The OpenAPI document served by this daemon
          content:
            application/yaml:
              schema:
                type: string
  /api/v1/healthz:
    get:
      summary: Health check (liveness)
      tags: [System]
      security: []
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/ready:
    get:
      summary: Readiness check
      description: |
        Reports whether the daemon is ready to serve traffic. Checks the
        dependencies the daemon actually uses: when etcd is configured it must
        answer a maintenance status RPC; in-memory (dev) stores have no
        external dependency and report ready immediately.
      tags: [System]
      security: []
      responses:
        "200":
          description: Ready
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
                  checks:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      etcd: true
        "503":
          description: Not ready (a dependency is unreachable)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: not_ready
                  checks:
                    type: object
                    additionalProperties:
                      type: boolean
                    example:
                      etcd: false

  # ── Auth ──────────────────────────────────────────────
  /api/v1/auth/login:
    post:
      summary: Authenticate user and get JWT
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: JWT issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
        "400":
          description: Missing username or password
        "401":
          description: Invalid credentials

  # ── Backup ────────────────────────────────────────────
  /api/v1/backup:
    get:
      summary: List state snapshots
      description: |
        Lists available etcd state snapshots (newest first). Requires a
        daemon backed by etcd; in-memory (dev) stores report no backups.
      tags: [System]
      responses:
        "200":
          description: List of snapshots
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotInfo"
    post:
      summary: Create a state snapshot
      description: |
        Snapshots the full etcd state to a JSON file on the daemon's backup
        directory and prunes snapshots beyond the configured retention.
      tags: [System]
      responses:
        "201":
          description: Snapshot created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotInfo"
        "400":
          description: Backup requires a persistent (etcd) store

  /api/v1/backup/{name}/restore:
    post:
      summary: Restore a state snapshot
      description: |
        Wipes the current etcd state and replays the snapshot, returning the
        cluster to the captured configuration.
      tags: [System]
      parameters:
        - name: name
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Snapshot restored
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotInfo"
        "400":
          description: Invalid snapshot name or unsupported format
        "404":
          description: Snapshot not found

  # ── VMs ──────────────────────────────────────────────
  /api/v1/vms:
    get:
      summary: List VMs
      tags: [Compute]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: VM list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VmConfig"
    post:
      summary: Create VM
      tags: [Compute]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VmCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/QuotaExceeded"

  /api/v1/vms/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get VM
      tags: [Compute]
      responses:
        "200":
          description: VM details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete VM
      tags: [Compute]
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/start:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Start VM
      tags: [Compute]
      responses:
        "200":
          description: VM started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/stop:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Stop VM
      tags: [Compute]
      responses:
        "200":
          description: VM stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/snapshot:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Snapshot a VM
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Snapshot taken
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Snapshot"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/restore:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Restore a VM from a snapshot
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [snapshot_id]
              properties:
                snapshot_id:
                  type: string
      responses:
        "200":
          description: VM restored
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/clone:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Clone a VM or template into a new VM
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              properties:
                name:
                  type: string
      responses:
        "201":
          description: Cloned VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/QuotaExceeded"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/resize:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Resize a VM (cpus / memory, hot on running VMs)
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                cpus:
                  type: integer
                  minimum: 0
                memory_mb:
                  type: integer
                  minimum: 0
      responses:
        "200":
          description: VM resized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/hotplug:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Hotplug a device (disk / NIC / CPU) on a running VM
      description: |
        Adds or removes a disk, NIC or CPU on a running VM without a reboot
        (T1.6). A disk `add` with `size_gb` creates a blank qcow2 of that size
        and attaches it; a `path` may be supplied instead of creating one. A
        disk `remove` targets the disk `id`. A NIC add/remove targets `tap`. A
        CPU add/remove resizes to the absolute `cpus` count.
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action, resource]
              properties:
                action:
                  type: string
                  enum: [add, remove]
                resource:
                  type: string
                  enum: [disk, nic, cpu]
                path:
                  type: string
                  description: Disk path (disk add; optional — size_gb creates one)
                size_gb:
                  type: integer
                  description: Blank disk size in GB (disk add)
                tap:
                  type: string
                  description: Tap/network name (nic)
                cpus:
                  type: integer
                  description: Target CPU count (cpu)
                id:
                  type: string
                  description: Disk id to remove (disk remove)
      responses:
        "200":
          description: Device hotplugged; returns the updated VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/memory:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Resize a VM's memory in place via balloon (T1.7)
      description: |
        Adjusts a running VM's live memory within its balloon bounds (min/max)
        without a reboot. Rejected with 400 when the target is outside the
        VM's balloon range or zero.
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [target_mb]
              properties:
                target_mb:
                  type: integer
                  minimum: 1
      responses:
        "200":
          description: Memory resized; returns the updated VM
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VmConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/disks:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      summary: Attach a data disk to a VM
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiskConfig"
      responses:
        "201":
          description: Disk attached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiskConfig"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/disks/{disk_id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: disk_id
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Detach a data disk from a VM
      tags: [Compute]
      responses:
        "200":
          description: Disk detached
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/nics:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      summary: Attach a NIC to a VM
      tags: [Compute]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tap]
              properties:
                tap:
                  type: string
      responses:
        "200":
          description: NIC attached
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/nics/{tap}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
      - name: tap
        in: path
        required: true
        schema:
          type: string
    delete:
      summary: Detach a NIC from a VM
      tags: [Compute]
      responses:
        "200":
          description: NIC detached
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/vms/{id}/console:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get console (VNC/vsock) access URL
      tags: [Compute]
      responses:
        "200":
          description: Console URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConsoleInfo"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Nodes (cluster) ─────────────────────────────────
  /api/v1/nodes:
    get:
      summary: List cluster nodes
      tags: [Node]
      responses:
        "200":
          description: Node list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      summary: Register a node
      tags: [Node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Node"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/nodes/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get a node
      tags: [Node]
      responses:
        "200":
          description: Node details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Remove a node
      tags: [Node]
      responses:
        "200":
          description: Removed
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/nodes/{id}/drain:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    put:
      summary: Start or stop draining a node
      tags: [Node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [drain]
              properties:
                drain:
                  type: boolean
      responses:
        "200":
          description: Node updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/nodes/{id}/heartbeat:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    post:
      summary: Node agent heartbeat (liveness + usage report)
      tags: [Node]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NodeHeartbeat"
      responses:
        "200":
          description: Node refreshed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Node"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Networks ─────────────────────────────────────────
  /api/v1/networks:
    get:
      summary: List networks
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Network list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Network"
    post:
      summary: Create network
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NetworkCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/QuotaExceeded"

  /api/v1/networks/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get network
      tags: [Network]
      responses:
        "200":
          description: Network details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Network"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete network
      tags: [Network]
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Storage ──────────────────────────────────────────
  /api/v1/storage/pools:
    get:
      summary: List storage pools
      tags: [Storage]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Pool list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoragePool"
    post:
      summary: Create storage pool
      tags: [Storage]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoragePoolCreate"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
        "400":
          $ref: "#/components/responses/ValidationError"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/QuotaExceeded"

  /api/v1/storage/pools/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get storage pool
      tags: [Storage]
      responses:
        "200":
          description: Pool details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoragePool"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete storage pool
      tags: [Storage]
      responses:
        "200":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Network VPC (T2.1) ──────────────────────────────
  /api/v1/network/routers:
    get:
      summary: List virtual routers
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Router list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VirtualRouter"
    post:
      summary: Create virtual router
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VirtualRouter"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualRouter"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/network/routers/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get virtual router
      tags: [Network]
      responses:
        "200":
          description: Router details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VirtualRouter"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete virtual router
      tags: [Network]
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/network/dhcp:
    get:
      summary: List DHCP/DNS servers
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: DHCP server list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DhcpServer"
    post:
      summary: Create DHCP/DNS server
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DhcpServer"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DhcpServer"

  /api/v1/network/dhcp/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get DHCP/DNS server
      tags: [Network]
      responses:
        "200":
          description: DHCP server details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DhcpServer"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete DHCP/DNS server
      tags: [Network]
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/network/floating-ips:
    get:
      summary: List floating IPs
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Floating IP list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FloatingIp"
    post:
      summary: Allocate floating IP
      tags: [Network]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FloatingIp"
      responses:
        "201":
          description: Allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingIp"

  /api/v1/network/floating-ips/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get floating IP
      tags: [Network]
      responses:
        "200":
          description: Floating IP details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FloatingIp"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Deallocate floating IP
      tags: [Network]
      responses:
        "200":
          description: Deallocated
        "404":
          $ref: "#/components/responses/NotFound"

  # ── S3 (T3.2) ───────────────────────────────────────
  /api/v1/s3/buckets:
    get:
      summary: List S3 buckets
      tags: [Storage]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Bucket list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/S3Bucket"
    post:
      summary: Create S3 bucket
      tags: [Storage]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/S3Bucket"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Bucket"
        "409":
          $ref: "#/components/responses/QuotaExceeded"

  /api/v1/s3/buckets/{name}:
    parameters:
      - name: name
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get S3 bucket
      tags: [Storage]
      responses:
        "200":
          description: Bucket details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3Bucket"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete S3 bucket
      tags: [Storage]
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/s3/credentials:
    get:
      summary: List S3 access keys
      tags: [Storage]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Access key list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/S3AccessKey"
    post:
      summary: Issue S3 credentials
      tags: [Storage]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/S3AccessKey"

  /api/v1/images:
    get:
      summary: List registered images
      tags: [Compute]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: Image list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Image"
    post:
      summary: Register an image
      tags: [Compute]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Image"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "400":
          $ref: "#/components/responses/ValidationError"

  /api/v1/images/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Show image
      tags: [Compute]
      responses:
        "200":
          description: Image details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Image"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Delete image
      tags: [Compute]
      responses:
        "200":
          description: Deleted
        "404":
          $ref: "#/components/responses/NotFound"

  /api/v1/images/{id}/template:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
    put:
      summary: Set image template flag
      tags: [Compute]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                template:
                  type: boolean
      responses:
        "200":
          description: Updated
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Metrics (T5.1) ──────────────────────────────────
  /api/v1/metrics:
    get:
      summary: Prometheus metrics scrape endpoint
      tags: [Observability]
      responses:
        "200":
          description: Prometheus text exposition
          content:
            text/plain:
              schema:
                type: string

  /api/v1/metrics/push:
    post:
      summary: Push a metric (daemon/UI)
      tags: [Observability]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/Metric"
      responses:
        "200":
          description: Pushed

  # ── Marketplace ──────────────────────────────────────
  /api/v1/marketplace/apps:
    get:
      summary: List marketplace apps
      tags: [Marketplace]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      responses:
        "200":
          description: App list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MarketplaceApp"
    post:
      summary: Install marketplace app
      tags: [Marketplace]
      parameters:
        - $ref: "#/components/parameters/TenantId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MarketplaceAppCreate"
      responses:
        "201":
          description: Installed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceApp"

  /api/v1/marketplace/apps/{id}:
    parameters:
      - $ref: "#/components/parameters/ResourceId"
    get:
      summary: Get marketplace app
      tags: [Marketplace]
      responses:
        "200":
          description: App details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceApp"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      summary: Uninstall marketplace app
      tags: [Marketplace]
      responses:
        "200":
          description: Uninstalled
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  # ── Quotas (T0.5) ───────────────────────────────────
  /api/v1/quotas:
    get:
      summary: List all tenant quotas
      tags: [Quotas]
      responses:
        "200":
          description: Quota list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TenantQuota"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/quotas/{tenant_id}:
    parameters:
      - name: tenant_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get tenant quota (unlimited when unset)
      tags: [Quotas]
      responses:
        "200":
          description: Tenant quota
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    put:
      summary: Set tenant quota
      tags: [Quotas]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TenantQuota"
      responses:
        "200":
          description: Quota updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TenantQuota"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    delete:
      summary: Delete tenant quota (back to unlimited)
      tags: [Quotas]
      responses:
        "204":
          description: Deleted
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  # ── Audit (T0.6) ────────────────────────────────────
  /api/v1/audit:
    get:
      summary: Query audit log
      description: |
        Records every mutation (who/what/when/tenant). Filters are optional.
      tags: [Audit]
      parameters:
        - name: tenant_id
          in: query
          required: false
          schema:
            type: string
        - name: user
          in: query
          required: false
          schema:
            type: string
        - name: action
          in: query
          required: false
          schema:
            type: string
            enum: [create, read, update, delete]
        - name: resource
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Audit entries (most recent first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/v1/audit/export:
    get:
      summary: Export full audit log as JSON
      tags: [Audit]
      responses:
        "200":
          description: Complete append-only audit log
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AuditEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT token from POST /auth/login. Roles:
        - admin: full access (wheel group members)
        - operator: same as admin, cannot modify auth settings
        - tenant_admin: full access within tenant
        - tenant_user: read-only + create own resources
        - auditor: read-only

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    TenantId:
      name: X-Tenant-Id
      in: header
      required: false
      description: Tenant scope (required after T0.4 multitenancy)
      schema:
        type: string
        format: uuid

  schemas:
    SnapshotInfo:
      type: object
      properties:
        name:
          type: string
          example: thiscloud-1786957043.json
        created_at:
          type: integer
          description: Unix timestamp of the snapshot
        size_bytes:
          type: integer
        entries:
          type: integer
          description: Number of key/value pairs captured
    VmConfig:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cpus:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 64
        disk_path:
          type: string
        kernel:
          type: string
        kernel_args:
          type: string
        networks:
          type: array
          items:
            type: string
        disks:
          type: array
          items:
            $ref: "#/components/schemas/DiskConfig"
        snapshots:
          type: array
          items:
            $ref: "#/components/schemas/Snapshot"
        cloud_init:
          type: string
          nullable: true
          description: Cloud-init user-data (cloud-config), applied at next boot
        uefi:
          type: boolean
          description: Boot with UEFI firmware (OVMF)
        tpm:
          type: boolean
          description: Attach a vTPM device (requires UEFI)
        template:
          type: boolean
          description: Mark VM as a reusable template
        node:
          type: string
          description: Placement node ID. Empty means the best-fit scheduler picks it
        affinity:
          type: array
          items:
            type: string
          description: Scheduler affinity labels (node must carry at least one)
        anti_affinity:
          type: array
          items:
            type: string
          description: Scheduler anti-affinity labels (node must not carry any)
        status:
          type: string
          enum: [running, stopped, error]
        tenant_id:
          type: string
          description: Owner tenant (set by server)
        balloon:
          type: object
          description: Memory balloon bounds for live memory adjustment (T1.7)
          properties:
            min_mb:
              type: integer
              description: Balloon floor — memory never drops below this
            max_mb:
              type: integer
              description: Balloon ceiling — memory never grows above this

    VmCreate:
      type: object
      required: [name, cpus, memory_mb]
      properties:
        name:
          type: string
        cpus:
          type: integer
          minimum: 1
        memory_mb:
          type: integer
          minimum: 64
        disk_path:
          type: string
        kernel:
          type: string
        kernel_args:
          type: string
        networks:
          type: array
          items:
            type: string
        cloud_init:
          type: string
          description: Cloud-init user-data (cloud-config), applied at next boot
        uefi:
          type: boolean
        tpm:
          type: boolean
        template:
          type: boolean
          description: Mark VM as a reusable template
        node:
          type: string
          description: Placement node ID. Empty means the best-fit scheduler picks it
        affinity:
          type: array
          items:
            type: string
        anti_affinity:
          type: array
          items:
            type: string

    Snapshot:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
        created_at:
          type: string
          description: UNIX epoch seconds

    DiskConfig:
      type: object
      required: [path]
      properties:
        id:
          type: string
        path:
          type: string
        size_gb:
          type: integer
          minimum: 0

    ConsoleInfo:
      type: object
      required: [url]
      properties:
        url:
          type: string
          description: WebSocket console endpoint (VNC/vsock proxied by the daemon)

    Node:
      type: object
      properties:
        id:
          type: string
          description: Server-assigned node ID
        name:
          type: string
        role:
          type: string
          enum: [master, worker]
        address:
          type: string
          description: ip:port of the node agent
        hostname:
          type: string
        cpus_total:
          type: integer
          minimum: 0
          description: 0 means unknown/unlimited
        cpus_used:
          type: integer
          minimum: 0
        memory_total_mb:
          type: integer
          minimum: 0
          description: 0 means unknown/unlimited
        memory_used_mb:
          type: integer
          minimum: 0
        vms:
          type: integer
          minimum: 0
        state:
          type: string
          enum: [online, offline, draining]
        last_seen_secs:
          type: integer
          description: UNIX epoch of last heartbeat
        ttl_secs:
          type: integer
          description: Seconds without heartbeat before a node goes offline
        labels:
          type: array
          items:
            type: string
          description: Scheduler affinity/anti-affinity labels

    NodeHeartbeat:
      type: object
      required: [cpus_used, memory_used_mb, vms]
      properties:
        cpus_used:
          type: integer
          minimum: 0
        memory_used_mb:
          type: integer
          minimum: 0
        vms:
          type: integer
          minimum: 0

    Network:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        cidr:
          type: string
          example: "10.0.0.0/24"
        gateway:
          type: string
        vlan:
          type: integer
          nullable: true
        dns:
          type: array
          items:
            type: string

    NetworkCreate:
      type: object
      required: [name, cidr, gateway]
      properties:
        name:
          type: string
        cidr:
          type: string
        gateway:
          type: string
        vlan:
          type: integer
        dns:
          type: array
          items:
            type: string

    StoragePool:
      type: object
      properties:
        name:
          type: string
        pool_type:
          type: string
          enum: [linstor, drbd, local, ceph]
        devices:
          type: array
          items:
            type: string
        replication:
          type: integer
          minimum: 1

    StoragePoolCreate:
      type: object
      required: [name, pool_type, replication]
      properties:
        name:
          type: string
        pool_type:
          type: string
          enum: [linstor, drbd, local, ceph]
        devices:
          type: array
          items:
            type: string
        replication:
          type: integer
          minimum: 1

    MarketplaceApp:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        app_type:
          type: string
          enum: [iso, docker, cloud-init, turbokit, k8s]
        source:
          type: string
        version:
          type: string
        status:
          type: string
          enum: [installed, installing, error]

    MarketplaceAppCreate:
      type: object
      required: [name, app_type, source]
      properties:
        name:
          type: string
        app_type:
          type: string
          enum: [iso, docker, cloud-init, turbokit, k8s]
        source:
          type: string
        version:
          type: string

    VirtualRouter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        net_id:
          type: string
        external_net_id:
          type: string
        ha:
          type: boolean
          default: false
        tenant_id:
          type: string
        status:
          type: string
          enum: [created, deleted]

    DhcpServer:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        net_id:
          type: string
        pool_start:
          type: string
        pool_end:
          type: string
        dns:
          type: array
          items:
            type: string
        tenant_id:
          type: string
        status:
          type: string
          enum: [created, deleted]

    FloatingIp:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        ip:
          type: string
        vm_id:
          type: string
        net_id:
          type: string
        tenant_id:
          type: string

    S3Bucket:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        tenant_id:
          type: string
        created_at:
          type: integer
          description: UNIX epoch seconds

    S3AccessKey:
      type: object
      properties:
        access_key:
          type: string
        secret_key:
          type: string
        user:
          type: string
        tenant_id:
          type: string

    Metric:
      type: object
      required: [name, value, metric_type]
      properties:
        name:
          type: string
          example: thiscloud_vms
        value:
          type: number
          format: double
        metric_type:
          type: string
          enum: [counter, gauge]
        labels:
          type: object
          additionalProperties:
            type: string

    TenantQuota:
      type: object
      required: [tenant_id]
      description: Per-tenant resource limits. 0 means unlimited.
      properties:
        tenant_id:
          type: string
        max_cpus:
          type: integer
          minimum: 0
        max_memory_mb:
          type: integer
          minimum: 0
        max_vms:
          type: integer
          minimum: 0
        max_storage_gb:
          type: integer
          minimum: 0
        max_networks:
          type: integer
          minimum: 0

    AuditEntry:
      type: object
      properties:
        id:
          type: string
          format: uuid
        timestamp:
          type: string
          description: Unix epoch seconds
        user:
          type: string
        role:
          type: string
        tenant_id:
          type: string
        action:
          type: string
          enum: [create, read, update, delete]
        resource:
          type: string
          example: vm
        resource_id:
          type: string
        detail:
          type: string

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 32
          pattern: "^[a-zA-Z0-9._-]+$"
        password:
          type: string

    LoginResponse:
      type: object
      properties:
        token:
          type: string
          description: JWT Bearer token
        role:
          type: string
          enum: [admin, tenant_user]
        tenant_id:
          type: string
        expires_at:
          type: integer
          description: Unix timestamp

    Image:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        source:
          type: string
          description: Artifact location (HTTP(S) URL or local pool path)
        sha256:
          type: string
          description: Expected/verified digest at import time
        size_bytes:
          type: integer
          format: int64
        format:
          type: string
          enum: [qcow2, iso, raw, cloud-init]
        os_family:
          type: string
          enum: [generic, alma, ubuntu, debian, fedora, rocky]
        version:
          type: string
        template:
          type: boolean
          description: Reusable as a VM template
        status:
          type: string
          enum: [available, importing, error]
        tenant_id:
          type: string
          description: Owner tenant (set by server)

    Error:
      type: object
      properties:
        error:
          type: string

  responses:
    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    ValidationError:
      description: Validation error
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    QuotaExceeded:
      description: Tenant quota exceeded
      content:
        application/json:
          schema:

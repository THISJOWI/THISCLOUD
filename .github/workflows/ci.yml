name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc + etcd
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler etcd-server
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform
      - run: cargo test --workspace
        working-directory: platform
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: platform

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: platform/go-api

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: platform/web-ui
      - run: npm test
        working-directory: platform/web-ui
      - run: npm run lint
        working-directory: platform/web-ui

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: stoplightio/spectral-action@v0.8.2
        with:
          file_glob: docs/api/openapi.yaml
          spectral_ruleset: .spectral.yaml
          spectral_ruleset_file: true
          fail_severity: error

  # ISO build, split in two jobs so it runs on GitHub-hosted runners (no
  # self-hosted AlmaLinux runner exists):
  #
  #   iso-build    — ubuntu-latest: cross-compiles Rust (musl), builds RPMs,
  #                  Go API and web-ui. No AlmaLinux needed. Stages artifacts.
  #   iso-assemble — ubuntu-latest + container almalinux:9: downloads the base
  #                  ISO, fetches dependency RPMs (needs dnf/EL repos), remixes
  #                  the ISO. Uploads artifact; on tags, attaches to the release.
  #
  # Runs on every push (main + tags), not on PRs (too heavy).
  iso-build:
    needs: [rust, go, web-ui]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl cross-compiler + protoc
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage compile artifacts (build-only mode)
        run: |
          cd platform
          THISCLOUD_BUILD_ONLY=1 bash iso/scripts/build-iso.sh
      - name: Package artifacts
        run: |
          mkdir -p iso-assets
          tar -C platform -czf iso-assets/iso-assets.tgz iso/repo
      - uses: actions/upload-artifact@v4
        with:
          name: iso-assets
          path: iso-assets/iso-assets.tgz
          retention-days: 7
          if-no-files-found: error

  iso-assemble:
    needs: [iso-build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso-assets
          path: iso-assets
      - name: Restore stage artifacts
        run: |
          tar -C platform -xzf iso-assets/iso-assets.tgz
          ls -lh platform/iso/repo | head -20

      - name: Resolve VERSION
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME:0:1}" == "v" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Each successful main build bumps the version by 0.1 (0.9 -> 1.0).
            # Source of truth: the highest existing release tag (vX.Y).
            LATEST=$(gh release list --limit 50 --json tagName \
              --jq '.[].tagName' 2>/dev/null \
              | grep -E '^v[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              next="0.1"
            else
              ver="${LATEST#v}"
              major="${ver%%.*}"
              minor="$(( 10#${ver##*.} + 1 ))"
              if [ "$minor" -eq 10 ]; then
                major=$(( major + 1 ))
                minor=0
              fi
              next="${major}.${minor}"
            fi
            echo "version=${next}" >> "$GITHUB_OUTPUT"
            echo "next main build version=${next}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download AlmaLinux base ISO
        run: |
          ALMAISO="${{ github.workspace }}/.iso-cache/AlmaLinux-9-latest-x86_64-minimal.iso"
          mkdir -p "$(dirname "$ALMAISO")"
          if [ ! -f "$ALMAISO" ]; then
            curl -fL -o "$ALMAISO" \
              https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso
          fi
          ls -lh "$ALMAISO"

      - name: Assemble ISO (almalinux:9 container, skip-compile mode)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          CONTAINER=thiscloud-iso-builder
          mkdir -p "${{ github.workspace }}/.iso-out" "${{ github.workspace }}/.iso-out-final"
          docker run --name="$CONTAINER" \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            -e VERSION="$VERSION" \
            -e THISCLOUD_SKIP_COMPILE=1 \
            -e ALMAISO=/build/.iso-cache/AlmaLinux-9-latest-x86_64-minimal.iso \
            -e OUT=/build/.iso-out \
            -e WORK_DIR=/tmp/.iso-work \
            almalinux:9 bash -lc '
              set -euo pipefail
              dnf install -y xorriso createrepo_c isomd5sum cpio gzip \
                dnf-utils dnf-plugins-core python3
              for tool in xorriso cpio createrepo_c implantisomd5 curl; do
                command -v "$tool" >/dev/null 2>&1 || { echo "::error::missing $tool"; exit 1; }
              done
              cd platform
              bash iso/scripts/build-iso.sh
              chown -R 1001:1001 "$OUT"
            '
          rc=$?
          echo "assemble rc=$rc"
          # docker rm -f removes files inside the bind mount (even host-written
          # ones), so stage the ISO outside the bind first, then restore it
          # into the workspace after the container is gone.
          if [ "$rc" -eq 0 ] && [ -n "$(ls "${{ github.workspace }}/.iso-out/"/*.iso 2>/dev/null)" ]; then
            mkdir -p "$HOME/iso-staging"
            cp "${{ github.workspace }}/.iso-out/"/*.iso "$HOME/iso-staging/"
            echo "ISO staged outside bind:"
            ls -lah "$HOME/iso-staging/"
          else
            echo "::error::no ISO produced in .iso-out"
          fi
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          if ls "$HOME/iso-staging/"/*.iso >/dev/null 2>&1; then
            cp "$HOME/iso-staging/"/*.iso "${{ github.workspace }}/.iso-out-final/"
            echo "ISO restored to .iso-out-final after docker rm:"
            ls -lah "${{ github.workspace }}/.iso-out-final/"
          fi
          exit "$rc"

      - name: Verify ISO output
        run: |
          ls -lh "${{ github.workspace }}/.iso-out-final/ThisCloud-*.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: thiscloud-iso
          path: .iso-out-final/*.iso
          retention-days: 30
          if-no-files-found: error

      - name: Upload ISO to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          files: .iso-out-final/ThisCloud-*.iso
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload ISO to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_BUCKET" ]]; then
            echo "R2 secrets not configured, skipping upload"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          ISO="${{ github.workspace }}/.iso-out-final/ThisCloud-${VERSION}-x86_64.iso"
          if [ ! -f "$ISO" ]; then
            echo "::error::ISO not found: $ISO"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          aws s3 cp --endpoint-url \
            "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            "$ISO" \
            "s3://$R2_BUCKET/ThisCloud-${VERSION}-x86_64.iso" \
            --quiet
          echo "uploaded to R2: ThisCloud-${VERSION}-x86_64.iso"
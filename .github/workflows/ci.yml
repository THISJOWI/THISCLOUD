name: ci

on:
  push:
    branches: [develop, main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - name: Install protoc + etcd
        timeout-minutes: 10
        run: |
          set -e
          installed=0
          for i in 1 2 3 4 5; do
            if sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 update \
                && sudo apt-get -o Acquire::Retries=5 -o Acquire::http::Timeout=60 install -y protobuf-compiler etcd-server; then
              echo "apt packages installed"
              installed=1
              break
            fi
            echo "apt attempt $i failed; retrying in 20s"
            sleep 20
          done
          if [ "$installed" -ne 1 ]; then
            echo "::error::apt install failed after 5 attempts"
            exit 1
          fi
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform
      - run: cargo test --workspace
        working-directory: platform
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: platform

  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - run: go test ./...
        working-directory: platform/go-api

  web-ui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
        working-directory: platform/web-ui
      - run: npm test
        working-directory: platform/web-ui
      - run: npm run lint
        working-directory: platform/web-ui

  openapi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lint OpenAPI spec
        run: npx --yes @stoplight/spectral-cli lint docs/api/openapi.yaml -r .spectral.yaml -F error

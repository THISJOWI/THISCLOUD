name: Build ISO

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. 0.4.0)"
        required: false
        default: "0.4.0"
  push:
    branches:
      - feature/native-os

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Rust check ──────────────────────────────────────────────────────

  rust-check:
    name: Rust check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Build + Test thpkg
        run: |
          cargo build -p thpkg
          cargo test -p thpkg
          cargo clippy -p thpkg -- -D warnings

  # ── ShellCheck ──────────────────────────────────────────────────────

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Lint
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          find os/kernel/ os/system/ -name '*.sh' -exec shellcheck --severity=warning {} +

  # ── Build ISO ───────────────────────────────────────────────────────

  build-iso:
    name: Build ISO
    runs-on: ubuntu-latest
    needs: [rust-check, shellcheck]
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools xorriso debootstrap \
            build-essential flex bison bc libssl-dev libelf-dev \
            cpio kmod libncurses-dev

      - name: Determine version
        id: version
        run: |
          VERSION="${{ github.event.inputs.version || '0.4.0' }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building THISCLOUD OS v$VERSION"

      - name: Build thpkg binary
        run: cargo build -p thpkg --release

      - name: Build vanilla Linux kernel
        run: |
          bash os/kernel/build-kernel.sh \
            --version 6.15.6 \
            --output build/kernel \
            --jobs $(nproc)
          echo "Kernel built:"
          ls -lh build/kernel/boot/

      - name: Create complete rootfs
        run: |
          VERSION=${{ steps.version.outputs.version }}
          bash os/kernel/build-rootfs.sh \
            --output build/rootfs \
            --version "$VERSION" \
            --kernel-version $(ls build/kernel/boot/vmlinuz-* | head -1 | xargs basename | sed 's/^vmlinuz-//') \
            --kernel-dir build/kernel

      - name: Create squashfs slot
        run: |
          VERSION=${{ steps.version.outputs.version }}
          mkdir -p build/release/slot

          # Copy kernel and initrd from rootfs to slot
          cp build/rootfs/boot/vmlinuz-* build/release/slot/vmlinuz 2>/dev/null || true
          cp build/rootfs/boot/initrd.img-* build/release/slot/initrd 2>/dev/null || true

          # Create squashfs of the rootfs (excluding /boot to keep slot small)
          mksquashfs build/rootfs build/release/slot/slot.squashfs \
            -noappend -comp gzip -b 1M \
            -e boot

          # Create manifest
          IMAGE_SHA=$(sha256sum build/release/slot/slot.squashfs | awk '{print $1}')
          KERNEL_SHA=$(sha256sum build/release/slot/vmlinuz 2>/dev/null | awk '{print $1}' || echo "")
          INITRD_SHA=$(sha256sum build/release/slot/initrd 2>/dev/null | awk '{print $1}' || echo "")
          cat > build/release/slot/manifest.json << EOF
          {
            "version": "$VERSION",
            "image_url": "slot.squashfs",
            "image_sha256": "$IMAGE_SHA",
            "kernel_url": "vmlinuz",
            "kernel_sha256": "$KERNEL_SHA",
            "initrd_url": "initrd",
            "initrd_sha256": "$INITRD_SHA",
            "signature": "",
            "el_layer_version": "",
            "sysexts": []
          }
          EOF

          echo "==> Slot created"
          ls -lh build/release/slot/

      - name: Build installer ISO
        run: |
          VERSION=${{ steps.version.outputs.version }}
          # Use kernel from our build
          OUR_KERNEL=$(ls build/kernel/boot/vmlinuz-* 2>/dev/null | head -1)
          OUR_INITRD=$(ls build/rootfs/boot/initrd.img-* 2>/dev/null | head -1)
          echo "Using kernel: ${OUR_KERNEL:-none}"
          echo "Using initrd: ${OUR_INITRD:-none}"
          bash os/kernel/build-installer.sh \
            --slot build/release/slot/slot.squashfs \
            --output build/release \
            --version "$VERSION" \
            ${OUR_KERNEL:+--kernel "$OUR_KERNEL"} \
            ${OUR_INITRD:+--initrd "$OUR_INITRD"}

      - name: Summary
        run: |
          echo ""
          echo "============================================"
          echo "  Build complete"
          echo "============================================"
          ls -lh build/release/
          file build/release/*.iso 2>/dev/null || true

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: ThisCloud-${{ steps.version.outputs.version }}-${{ github.sha }}
          path: |
            build/release/ThisCloud-*
            build/release/slot/manifest.json
            build/release/slot/*.squashfs
          retention-days: 7

      - name: Upload ISO to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: https://download.thisjowi.com
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_BUCKET" ]]; then
            echo "R2 secrets not configured, skipping upload"
            exit 0
          fi
          VERSION=${{ steps.version.outputs.version }}
          # Find the installer artifact (ISO or tarball)
          ARTIFACT=$(ls build/release/ThisCloud-${VERSION}-installer-* 2>/dev/null | head -1)
          if [ -z "$ARTIFACT" ] || [ ! -f "$ARTIFACT" ]; then
            echo "::error::Installer artifact not found in build/release/"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          KEY="releases/${VERSION}/$(basename "$ARTIFACT")"
          aws s3 cp --endpoint-url \
            "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            "$ARTIFACT" \
            "s3://${R2_BUCKET}/${KEY}" \
            --quiet
          echo "uploaded to R2: $KEY"
          echo "download: ${R2_PUBLIC_URL}/${KEY}"

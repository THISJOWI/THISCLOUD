name: release-please

on:
  push:
    branches:
      - develop
      - main
  # Forzar una versión concreta (p.ej. la primera estable de main):
  # disparar manualmente con release-as: 0.4.0
  workflow_dispatch:
    inputs:
      release-as:
        description: "Version to force (e.g. 0.4.0). Empty = auto"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: ${{ github.ref_name == 'main' && 'release-please-config.json' || 'release-please-config.develop.json' }}
          manifest-file: .release-please-manifest.json
          target-branch: ${{ github.ref_name }}
          release-as: ${{ inputs.release-as || '' }}

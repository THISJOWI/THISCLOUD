name: ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

# ISO build, split in two jobs so it runs on GitHub-hosted runners (no
# self-hosted AlmaLinux runner exists):
#
#   iso-build    — ubuntu-latest: cross-compiles Rust (musl), builds RPMs,
#                  Go API and web-ui. No AlmaLinux needed. Stages artifacts.
#   iso-assemble — ubuntu-latest + container almalinux:9: downloads the base
#                  ISO, fetches dependency RPMs (needs dnf/EL repos), remixes
#                  the ISO. Uploads artifact and to R2.
#
# Runs on manual dispatch or on release tags (v*). Not on plain main pushes.

jobs:
  iso-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install musl cross-compiler + protoc
        run: sudo apt-get update && sudo apt-get install -y musl-tools protobuf-compiler
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: platform
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Stage compile artifacts (build-only mode)
        run: |
          cd platform
          THISCLOUD_BUILD_ONLY=1 bash iso/scripts/build-iso.sh
      - name: Package artifacts
        run: |
          mkdir -p iso-assets
          tar -C platform -czf iso-assets/iso-assets.tgz iso/repo
      - uses: actions/upload-artifact@v4
        with:
          name: iso-assets
          path: iso-assets/iso-assets.tgz
          retention-days: 7
          if-no-files-found: error

  iso-assemble:
    needs: [iso-build]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: iso-assets
          path: iso-assets
      - name: Restore stage artifacts
        run: |
          tar -C platform -xzf iso-assets/iso-assets.tgz
          ls -lh platform/iso/repo | head -20

      - name: Resolve VERSION
        id: version
        run: |
          if [[ "${GITHUB_REF_NAME:0:1}" == "v" ]]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            # Manual dispatch: bump by 0.1 over the latest release (0.9 -> 1.0).
            # Source of truth: the highest existing release tag (vX.Y or vX.Y.Z).
            LATEST=$(gh release list --limit 50 --json tagName \
              --jq '.[].tagName' 2>/dev/null \
              | grep -E '^v[0-9]+\.[0-9]+(\.[0-9]+)?$' | sort -V | tail -1 || true)
            if [ -z "$LATEST" ]; then
              next="0.1"
            else
              ver="${LATEST#v}"
              major="${ver%%.*}"
              rest="${ver#*.}"
              minor="$(( 10#${rest%%.*} + 1 ))"
              if [ "$minor" -eq 10 ]; then
                major=$(( major + 1 ))
                minor=0
              fi
              next="${major}.${minor}"
            fi
            echo "version=${next}" >> "$GITHUB_OUTPUT"
            echo "manual build version=${next}"
          fi
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Download AlmaLinux base ISO
        run: |
          ALMAISO="${{ github.workspace }}/.iso-cache/AlmaLinux-9-latest-x86_64-minimal.iso"
          mkdir -p "$(dirname "$ALMAISO")"
          if [ ! -f "$ALMAISO" ]; then
            curl -fL -o "$ALMAISO" \
              https://repo.almalinux.org/almalinux/9/isos/x86_64/AlmaLinux-9-latest-x86_64-minimal.iso
          fi
          ls -lh "$ALMAISO"

      - name: Assemble ISO (almalinux:9 container, skip-compile mode)
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # The builder writes the ISO to a container-LOCAL dir (/out), never
          # into the bind-mounted workspace: dockerd's teardown of `docker rm`
          # sweeps bind-mount contents on GitHub-hosted runners (even files the
          # host writes there), which silently deleted every previous attempt's
          # ISO. Extract via docker cp into runner.temp (outside the bind)
          # while the container still exists, then remove it.
          CONTAINER=thiscloud-iso-builder
          ISO_HOST_DIR="${{ runner.temp }}/iso-out"
          docker run --name="$CONTAINER" \
            -v "${{ github.workspace }}:/build" \
            -w /build \
            -e VERSION="$VERSION" \
            -e THISCLOUD_SKIP_COMPILE=1 \
            -e ALMAISO=/build/.iso-cache/AlmaLinux-9-latest-x86_64-minimal.iso \
            -e OUT=/out \
            -e WORK_DIR=/tmp/.iso-work \
            almalinux:9 bash -lc '
              set -euo pipefail
              dnf install -y xorriso createrepo_c isomd5sum cpio gzip \
                dnf-utils dnf-plugins-core python3
              for tool in xorriso cpio createrepo_c implantisomd5 curl; do
                command -v "$tool" >/dev/null 2>&1 || { echo "::error::missing $tool"; exit 1; }
              done
              cd platform
              bash iso/scripts/build-iso.sh
            '
          rc=$?
          echo "assemble rc=$rc"
          mkdir -p "$ISO_HOST_DIR"
          if [ "$rc" -eq 0 ]; then
            docker cp "$CONTAINER:/out/ThisCloud-${VERSION}-x86_64.iso" "$ISO_HOST_DIR/"
            sudo chown -R "$(id -u):$(id -g)" "$ISO_HOST_DIR"
            echo "ISO extracted outside bind:"
            ls -lah "$ISO_HOST_DIR/"
          else
            echo "::error::ISO assembly failed (rc=$rc)"
          fi
          docker rm -f "$CONTAINER" >/dev/null 2>&1 || true
          if [ ! -f "$ISO_HOST_DIR/ThisCloud-${VERSION}-x86_64.iso" ]; then
            echo "::error::no ISO extracted to $ISO_HOST_DIR"
            exit 1
          fi

      - name: Verify ISO output
        run: |
          ls -lh "${{ runner.temp }}/iso-out/ThisCloud-${{ steps.version.outputs.version }}-x86_64.iso"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: thiscloud-iso
          path: ${{ runner.temp }}/iso-out/*.iso
          retention-days: 30
          if-no-files-found: error

      - name: Upload ISO to Cloudflare R2
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_URL: https://download.thisjowi.com
        run: |
          if [[ -z "$R2_ACCOUNT_ID" || -z "$R2_ACCESS_KEY_ID" || -z "$R2_SECRET_ACCESS_KEY" || -z "$R2_BUCKET" ]]; then
            echo "R2 secrets not configured, skipping upload"
            exit 0
          fi
          VERSION="${{ steps.version.outputs.version }}"
          ISO="${{ runner.temp }}/iso-out/ThisCloud-${VERSION}-x86_64.iso"
          if [ ! -f "$ISO" ]; then
            echo "::error::ISO not found: $ISO"
            exit 1
          fi
          export AWS_ACCESS_KEY_ID="$R2_ACCESS_KEY_ID"
          export AWS_SECRET_ACCESS_KEY="$R2_SECRET_ACCESS_KEY"
          export AWS_DEFAULT_REGION=auto
          KEY="releases/${VERSION}/ThisCloud-${VERSION}-x86_64.iso"
          aws s3 cp --endpoint-url \
            "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            "$ISO" \
            "s3://$R2_BUCKET/$KEY" \
            --quiet
          echo "uploaded to R2: $KEY"
          echo "download: $R2_PUBLIC_URL/$KEY"